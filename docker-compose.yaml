services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: document_repository
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_user -d document_repository"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cache for search results. Nothing here is the source of truth, so no volume.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The services below run only with: docker compose --profile app up -d --build
  # Without the profile, "docker compose up -d" starts just the database and Redis
  # for local development with npm run dev.

  # Virus scanner for uploads. On the first start it downloads the virus
  # signatures (about 300 MB, kept in a volume) and needs a few minutes before
  # it answers; until then uploads are refused with "try again in a minute".
  # Needs about 1.5 GB of memory.
  clamav:
    profiles: ["app"]
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 6m

  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://document_user:local_dev_password@db:5432/document_repository
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local_docker_secret_change_me_0123456789}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 10
      # Served over plain http on localhost, so the cookie cannot be Secure
      COOKIE_SECURE: "false"
      SEED_DEMO_DATA: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: browsing and search work while signatures load
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  clamav_data:
